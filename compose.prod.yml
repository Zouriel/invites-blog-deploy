# invites.blog production stack.
# Safe/additive on a shared host: unique container names, an internal network for Postgres (NO host
# port bindings), and the app + web containers also join the external `proxy` network so the shared
# Caddy reverse-proxy reaches them by name. Build contexts are sibling repos cloned next to this one.
services:
  postgres:
    image: postgres:17-alpine
    container_name: invites-blog-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invites_blog}
      POSTGRES_USER: ${POSTGRES_USER:-invites}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - invites-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-invites} -d $${POSTGRES_DB:-invites_blog}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [invites-internal]

  api:
    build:
      context: ../invites-blog-backend
      dockerfile: InvitesBlog.Api/Dockerfile
    container_name: invites-blog-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-invites_blog};Username=${POSTGRES_USER:-invites};Password=${POSTGRES_PASSWORD}
      # Object storage — set STORAGE_PROVIDER=Minio (+ MinIO creds below) to store assets in MinIO;
      # defaults to Local (disk volume) so the stack still runs without MinIO.
      Storage__Provider: ${STORAGE_PROVIDER:-Local}
      Storage__Endpoint: ${STORAGE_ENDPOINT:-}
      Storage__Bucket: ${STORAGE_BUCKET:-invites-assets}
      Storage__AccessKey: ${MINIO_ROOT_USER:-}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:-}
      # Relative asset base → template packageUrls resolve same-origin on whatever host serves the app.
      Urls__AssetsBase: /assets
      Urls__InviterBase: https://invites.blog
      Urls__InviteeBase: https://me.invites.blog
      Urls__ApiBase: https://invites.blog
      Jwt__Issuer: invites.blog
      Jwt__Audience: invites.blog
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      Admin__Email: ${ADMIN_EMAIL:-admin@invites.blog}
      Admin__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      Payments__Provider: Fake
      Payments__WebhookSecret: ${PAYMENTS_WEBHOOK_SECRET:-fake-webhook-secret}
      # Email — set EMAIL_PROVIDER=Resend + RESEND_* in .env to go live; defaults to Console (logs only).
      Email__Provider: ${EMAIL_PROVIDER:-Console}
      Email__ApiKey: ${RESEND_API_KEY:-}
      Email__From_Invites: ${EMAIL_FROM_INVITES:-invites.blog <invites@invites.blog>}
      Email__From_System: ${EMAIL_FROM_SYSTEM:-invites.blog <no-reply@invites.blog>}
      Email__WebhookSecret: ${RESEND_WEBHOOK_SECRET:-}
      Otp__Channels: ${OTP_CHANNELS:-Email}
      # SMS OTP via MsgOwl. Leave MSGOWL_API_KEY empty to keep phone sign-in switched off:
      # the api reports smsAvailable=false and the OTP channel gate rejects Sms requests.
      # SenderId must be <=11 alphanumeric GSM chars — no dots.
      Sms__MsgOwl__ApiKey: ${MSGOWL_API_KEY:-}
      Sms__MsgOwl__SenderId: ${MSGOWL_SENDER_ID:-InvitesBlog}
      # Viber delivery (Infobip) — leave INFOBIP_API_KEY empty to keep the channel log-only (no real sends).
      Infobip__BaseUrl: ${INFOBIP_BASE_URL:-}
      Infobip__ApiKey: ${INFOBIP_API_KEY:-}
      Infobip__ViberSender: ${INFOBIP_VIBER_SENDER:-}
      Infobip__WebhookToken: ${INFOBIP_WEBHOOK_TOKEN:-}
      # Google / Microsoft sign-in. Each provider stays hidden in the UI until its client id is set,
      # so leaving these empty keeps email + password as the only way in. Browser-side implicit flow
      # (response_type=id_token) — there is no client secret to keep here.
      OAuth__Google__ClientId: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAuth__Microsoft__ClientId: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      OAuth__Microsoft__Tenant: ${OAUTH_MICROSOFT_TENANT:-common}
    volumes:
      - invites-assets-data:/app/wwwroot/assets
    depends_on:
      postgres:
        condition: service_healthy
      # Wait for the bucket to exist before the startup template seeder writes to storage.
      invites-blog-minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [invites-internal, proxy]

  # S3-compatible object storage for template packages + campaign images (§7.1).
  # Not published to any host port; reachable only inside the docker networks. Public reads
  # are served through Caddy's /assets/* route (see Caddyfile.d/invites-blog.caddy).
  # NB: the service is named `invites-blog-minio` (NOT `minio`) on purpose — Compose registers the
  # service name as a network alias on the shared external `proxy` network, and a bare `minio` alias
  # would collide with other projects' MinIO on that network. Keep it uniquely prefixed.
  invites-blog-minio:
    image: minio/minio:latest
    container_name: invites-blog-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - invites-minio-data:/data
    restart: unless-stopped
    networks: [invites-internal, proxy]

  # One-shot: wait for MinIO, create the bucket, and make it anonymously readable (objects are
  # public assets served via Caddy). Idempotent — safe to re-run on every `up`.
  invites-blog-minio-init:
    image: minio/mc:latest
    container_name: invites-blog-minio-init
    depends_on:
      invites-blog-minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-invites-assets}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://invites-blog-minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do echo 'waiting for minio...'; sleep 2; done;
      mc mb --ignore-existing local/$$STORAGE_BUCKET;
      mc anonymous set download local/$$STORAGE_BUCKET;
      echo 'minio bucket ready: '$$STORAGE_BUCKET;
      "
    restart: "no"
    networks: [invites-internal]

  web-inviter:
    build:
      context: ../invites-blog-frontend
      args:
        APP: web-inviter
        # @zouriel/ui is a private GitHub Packages dependency (needs read:packages scope).
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:?NODE_AUTH_TOKEN is required (GitHub token with read:packages scope)}
    container_name: invites-blog-web-inviter
    restart: unless-stopped
    networks: [proxy]

  web-invitee:
    build:
      context: ../invites-blog-frontend
      args:
        APP: web-invitee
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:?NODE_AUTH_TOKEN is required (GitHub token with read:packages scope)}
    container_name: invites-blog-web-invitee
    restart: unless-stopped
    networks: [proxy]

networks:
  proxy:
    external: true
  invites-internal:
    driver: bridge

volumes:
  invites-postgres-data:
  invites-assets-data:
  invites-minio-data:
